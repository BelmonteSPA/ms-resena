server:
  port: 8085

spring:
  application:
    name: ms-resena

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/db_resena?createDatabaseIfNotExist=true&serverTimezone=America/Santiago}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

# URL de ms-viajes (con Eureka activo se deja vacia y se resuelve por nombre)
clients:
  viajes:
    url: ${MS_VIAJES_URL:http://localhost:8084}

eureka:
  client:
    enabled: false